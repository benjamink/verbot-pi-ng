[project]
name = "verbot-pi-ng"
version = "0.1.0"
description = "Control a 1984 Tomy Verbot toy robot with a Raspberry Pi Zero 2 W"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Benjamin Krein", email = "superbenk@gmail.com" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "zeroconf>=0.140",
]

[project.optional-dependencies]
# Hardware-only deps. Installed on the Pi via `uv sync --extra pi`.
# Omitted on dev machines so the test suite runs anywhere.
pi = ["lgpio>=0.2.2.0", "smbus2>=0.5.0"]

[project.scripts]
verbot = "verbot.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "httpx>=0.28", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verbot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
